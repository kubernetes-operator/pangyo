# === API 컨테이너 이미지 게시 (GHCR, 공개 저장소 → 공개 이미지) ===
# 태그: sha-<커밋 7자리> (배포에 사용), 브랜치 이름. 비밀값은 GitHub 기본 GITHUB_TOKEN만 사용.
name: image
on:
  workflow_dispatch:
  push:
    branches: [main, "feature/roadmap05-*"]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "apps/web/**"
      - "db/postgres/**"
      - "Cargo.lock"
      - "package-lock.json"
      - ".github/workflows/image.yml"
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/memonest-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
