# === 서버 공통 설정 변수: 배포 환경마다 주입되며 암호 저장 금지 ===
service_name: memonest-api
listen_env: API_BIND_ADDRESS
max_accounts: 999 # 1000명 미만 사용자 요구 (서버 로직 적용은 추후)
auth:
  provider: oidc # 추후 OIDC/OAuth2 PKCE 기반
  enabled: false # 현재 API는 /healthz, /readyz, /api/v1/info 만 노출
storage:
  metadata: postgresql # 사용량, 개정/버전, 계정, 접속 장비
  blob: s3 # S3 호환 저장소, 객체 버전 및 복구 정책 포함
  user_tier_quota_mb:
    free: 100
    plus: 1024
    pro: 10240
search:
  text_search: postgres_trgm # 유사 메모 계산은 서버에서만 실행
  embeddings: false # 초기에는 별도 GPU/벡터DB 불필요
security:
  require_tls: true # 실제 배포 시 외부 HTTPS 강제
  audit_enabled: true # 저장·편집·로그인 이벤트를 설계상 추적
