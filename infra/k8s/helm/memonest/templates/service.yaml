apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "memonest.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: memonest, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    {{- if .Values.monitoring.enabled }}
    # 지표: 클러스터 안(Prometheus)에서만. HTTPRoute는 http 포트만 연결
    - {name: metrics, port: {{ .Values.monitoring.port }}, targetPort: metrics}
    {{- end }}
