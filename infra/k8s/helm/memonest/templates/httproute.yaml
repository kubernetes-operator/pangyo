{{- if .Values.httpRoute.enabled }}
{{- if or (not .Values.httpRoute.gatewayName) (not .Values.httpRoute.hostname) }}
{{- fail "HTTPRoute needs gatewayName and hostname" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayName | quote }}
      {{- if .Values.httpRoute.gatewayNamespace }}
      namespace: {{ .Values.httpRoute.gatewayNamespace | quote }}
      {{- end }}
  hostnames: [{{ .Values.httpRoute.hostname | quote }}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: {{ .Release.Name }}, port: {{ .Values.service.port }} }]
{{- end }}
