[package]
# MemoNest 공통 도메인: 경로 규칙, 로컬 .md/.txt 파일 저장소 (Tauri, BSD TUI, 서버가 공유)
name = "memonest-core"
description = "MemoNest shared domain: path rules and local Markdown/TXT note store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# 데스크톱(Tauri) 작업공간: .md 파일 + SQLite 보조 인덱스. BSD 앱은 쓰지 않아 기본 비활성.
workspace = ["dep:rusqlite", "dep:serde", "dep:serde_json", "dep:uuid", "dep:sha2", "dep:same-file", "dep:humantime"]

[dependencies]
thiserror = "2"
unicode-normalization = "0.1"
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = { version = "0.10", optional = true }
same-file = { version = "1", optional = true }
humantime = { version = "2", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rusqlite = "0.37"
